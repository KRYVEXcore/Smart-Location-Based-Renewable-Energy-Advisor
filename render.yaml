services:
  - type: web
    name: renewable-energy-advisor-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: RUN_DATA_SEED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://kryvexcore.github.io
      - key: NVIDIA_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: renewable-energy-advisor-db
          property: connectionString

databases:
  - name: renewable-energy-advisor-db
    plan: free
