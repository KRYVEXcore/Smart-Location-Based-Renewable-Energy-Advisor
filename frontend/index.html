<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHREA AI</title>
    <script>
      // Apply the saved theme (or the system one on a first visit) before the first paint, so there is no flash.
      try {
        var saved = localStorage.getItem('shrea-theme')
        if (saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="A location-aware renewable energy decision-support platform for individuals and small institutions."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
