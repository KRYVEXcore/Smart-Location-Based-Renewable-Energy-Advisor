name: Deploy frontend to GitHub Pages

# Builds and publishes only frontend/ as a static site. GitHub Pages cannot
# run a backend, so API calls go to whatever URL the API_BASE_URL repo
# variable holds (the Render service, see render.yaml). With that variable
# unset the site is a UI-only preview and API-backed features show their
# normal error states.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Set under Settings > Secrets and variables > Actions > Variables.
          # Unset means the site builds without a backend and API-backed
          # features show their normal error states.
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - name: Add SPA fallback for client-side routing
        # GitHub Pages has no server-side rewrite, so a direct link/refresh
        # to e.g. /dashboard/<id> would 404. Pages falls back to 404.html
        # for any unmatched path, and serving the same SPA shell there lets
        # React Router take over and render the right route client-side.
        working-directory: frontend/dist
        run: cp index.html 404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
